[project]
name = "trellis"
version = "0.2.0"
description = "Trellis: a schema-grounded, safety-first agentic text-to-SQL CLI on Fireworks AI"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yogesh Naren Bundey" }]
requires-python = ">=3.11"
dependencies = [
    "openai",
    "pydantic",
    "python-dotenv",
    "rich",
    "sqlglot",
]

[project.scripts]
trellis = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "benchmark"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests"]
