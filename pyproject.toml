[project]
name = "trellis"
version = "0.2.0"
description = "Trellis: a schema-grounded, safety-first agentic text-to-SQL CLI on Fireworks AI"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yogesh Naren Bundey" }]
requires-python = ">=3.11"
dependencies = [
    "openai",
    "pydantic",
    "python-dotenv",
    "rich",
    "sqlglot",
]

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[project.scripts]
trellis = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["bird_data: needs the BIRD data under data/bird (./scripts/setup_bird_minidev.sh)"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests"]
