<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="t d"><title id="t">Quality, cost and latency of every variant tested</title><desc id="d">Pareto view over the same 100 stratified questions.</desc><rect width="900" height="520" rx="12" fill="#0d1117" stroke="#30363d"/><text x="24.0" y="34.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600">Quality, cost and latency: the same 100 questions, every variant</text><text x="24.0" y="54.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400">official EX (y, +/-4 pts at 95%) vs cost per query with no prompt cache (x, log); bubble area = P50 latency</text><line x1="80" y1="430.0" x2="860" y2="430.0" stroke="#30363d" stroke-width="0.7"/><text x="70.0" y="434.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="end" font-weight="400">64%</text><line x1="80" y1="360.8" x2="860" y2="360.8" stroke="#30363d" stroke-width="0.7"/><text x="70.0" y="364.8" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="end" font-weight="400">66%</text><line x1="80" y1="291.6" x2="860" y2="291.6" stroke="#30363d" stroke-width="0.7"/><text x="70.0" y="295.6" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="end" font-weight="400">68%</text><line x1="80" y1="222.4" x2="860" y2="222.4" stroke="#30363d" stroke-width="0.7"/><text x="70.0" y="226.4" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="end" font-weight="400">70%</text><line x1="80" y1="153.2" x2="860" y2="153.2" stroke="#30363d" stroke-width="0.7"/><text x="70.0" y="157.2" font-family="-apple-system, 'Segoe UI'